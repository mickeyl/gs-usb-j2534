name: Release

# Push a tag such as v0.2.0 to build the package and publish it as a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag must match the crate version
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "tag $env:GITHUB_REF_NAME does not match Cargo.toml version $version" }
      - name: Add the 32-bit target
        run: rustup target add i686-pc-windows-msvc
      - name: Test (x64)
        run: cargo test --release
      - name: Test (x86)
        run: cargo test --release --target i686-pc-windows-msvc
      - name: Build both DLLs
        run: |
          cargo build --release
          cargo build --release --target i686-pc-windows-msvc
      - name: Package
        run: scripts\package.ps1
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME --title "gs-usb-j2534 $env:GITHUB_REF_NAME" --generate-notes (Get-ChildItem dist\*.zip, dist\*.sha256).FullName
