name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add the 32-bit target
        run: rustup target add i686-pc-windows-msvc
      - name: Format and lint
        run: |
          cargo fmt --check
          cargo clippy --release --all-targets -- -D warnings
      - name: Test (x64)
        run: cargo test --release
      - name: Test (x86)
        run: cargo test --release --target i686-pc-windows-msvc
      - name: Build both DLLs
        run: |
          cargo build --release
          cargo build --release --target i686-pc-windows-msvc
      - name: Package
        run: scripts\package.ps1 -Version ci
      - uses: actions/upload-artifact@v4
        with:
          name: gs-usb-j2534-windows
          path: dist/*.zip
